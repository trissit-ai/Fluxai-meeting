version: "3.8"

services:
  # 后端 API 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - DEEPL_API_KEY=${DEEPL_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-change_me_32chars}
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端（开发模式，用 vite dev server）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
      - VITE_LIVEKIT_URL=${LIVEKIT_URL}
      - VITE_LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - VITE_LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - VITE_DEEPGRAM_KEY=${DEEPGRAM_API_KEY}
      - VITE_DEEPL_KEY=${DEEPL_API_KEY}
      - VITE_ELEVENLABS_KEY=${ELEVENLABS_API_KEY}
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: meeting-ai-net
